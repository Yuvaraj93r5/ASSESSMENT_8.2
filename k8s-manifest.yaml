apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-feedback-deployment
  labels:
    app: student-feedback
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-feedback
  template:
    metadata:
      labels:
        app: student-feedback
    spec:
      containers:
      - name: feedback-app
        # Replace 'your-dockerhub-username' with your actual Docker Hub username
        image: yuvaraj93/student-feedback:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-feedback-service
spec:
  type: NodePort
  selector:
    app: student-feedback
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
